<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out</title>
    <link rel="stylesheet" href="../css/mk1.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logout-card {
            text-align: center;
            max-width: 420px;
            width: 90%;
            padding: 40px 32px;
            background: var(--glass);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
        }

        .logout-card h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            margin-bottom: 10px;
        }

        .logout-card p {
            color: var(--muted);
            margin-bottom: 24px;
        }

        .logout-card #countdown {
            color: var(--accent);
            font-weight: 600;
        }

        .logout-card a {
            display: inline-block;
            margin: 6px;
            padding: 10px 22px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--glass-strong);
            color: var(--text);
            text-decoration: none;
            transition: background 0.2s;
        }

        .logout-card a:hover {
            background: rgba(255, 255, 255, 0.16);
        }
    </style>
</head>
<body>
<div class="logout-card">
    <h1>You have been logged out</h1>
    <p>Thanks for using Attendance Alloter.<br>
        Redirecting to the home page in <span id="countdown">5</span>s...</p>
    <a href="index.html">Back to Home</a>
    <a href="faculty-dashboard.html">Faculty Login</a>
    <a href="student-dashboard.html">Student Login</a>
</div>

<script>
    // clear the saved login so the dashboards ask for id/password again
    try { sessionStorage.clear(); } catch (err) {}

    // auto-redirect after 5 seconds
    let seconds = 5;
    const countdown = document.getElementById("countdown");
    const timer = setInterval(() => {
        seconds--;
        countdown.innerText = seconds;
        if (seconds <= 0) {
            clearInterval(timer);
            window.location.href = "index.html";
        }
    }, 1000);
</script>
</body>
</html>
